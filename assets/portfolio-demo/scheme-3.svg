<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 700 525" role="img" aria-labelledby="title desc"><title id="title">Условная схема 3</title><desc id="desc">Демонстрационная графика интерфейса. Не фотография выполненного заказа и не технический чертёж.</desc><rect width="700" height="525" fill="#f7f8f4"/><path d="M50 70h600M50 420h600" stroke="#d8e0d8"/><g fill="none" stroke="#f46c26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="100" y="90" width="500" height="300" rx="10" stroke="#bac7c0"/><rect x="125" y="115" width="180" height="250" rx="9"/><rect x="330" y="115" width="245" height="110" rx="9"/><rect x="330" y="250" width="245" height="115" rx="9"/></g><text x="50" y="45" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" fill="#60716b">I-CUT.PRO / ДЕМОНСТРАЦИЯ ИНТЕРФЕЙСА</text><text x="50" y="465" font-family="Arial,sans-serif" font-size="18" fill="#344b40">СХЕМА 03 / НЕ ФОТОГРАФИЯ РАБОТЫ</text><text x="50" y="495" font-family="Arial,sans-serif" font-size="12" fill="#73817b">Условная графика без технических параметров</text></svg>